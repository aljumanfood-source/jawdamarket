<style>
/* Layout: a printed-poster hero (deep brand red, gold sunburst, product pyramid, live countdown) that is itself the button → white shelf of arched product stages in three aisles, with a WhatsApp delivery pill always in reach. Single committed brand look. */
:root{
  color-scheme: light;
  --red:#d5132b; --red-l:#ee2f45; --red-d:#8f0718; --wine:#5e0410;
  --gold:#f6b928; --gold-l:#ffe39a; --sun:#fff5d6;
  --bg:#fbf6ee; --paper:#ffffff; --ink:#2a1a14; --muted:#7a675b; --line:#efe1c8;
  --navy:#1756a8; --teal:#0f8a76; --wa:#16a34a; --wa-d:#0f7a36;
  --f-display:"Lalezar","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--wine);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.in-shop{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--red-d)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:lining-nums tabular-nums;direction:ltr;unicode-bidi:isolate}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}

/* ============ LANDING ============ */
.landing{min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#7a0716 0%,var(--wine) 70%)}
.landing-in{padding-block:18px 120px;display:flex;flex-direction:column;align-items:center;gap:16px}

.poster{position:relative;display:block;width:100%;max-width:460px;border:0;padding:0;text-align:center;color:#fff;border-radius:26px;overflow:hidden;
  background:radial-gradient(85% 55% at 50% 40%,var(--red-l) 0%,var(--red) 55%,var(--red-d) 100%);
  box-shadow:0 0 0 2px var(--gold),0 0 0 7px var(--red-d),0 0 0 8px rgba(255,227,154,.5),0 24px 50px rgba(0,0,0,.45);
  margin-top:8px;transition:transform .2s}
.poster:active{transform:scale(.985)}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.p-in{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 16px 20px}

.p-logo{background:#fff;border-radius:0 0 20px 20px;padding:8px 20px 10px;border:2px solid var(--gold);border-top:0;box-shadow:0 6px 16px rgba(80,0,10,.35)}
.p-logo img{display:block;height:46px;width:auto}
.ribbon{margin-top:14px;display:inline-block;background:var(--gold);color:var(--red-d);font-weight:900;font-size:15px;padding:4px 18px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 3px 0 #b07b06}
.head{font-family:var(--f-display);font-weight:400;line-height:.95;margin:12px 0 0;text-shadow:0 4px 0 rgba(90,0,12,.45)}
.head .l1{display:block;font-size:clamp(34px,10vw,46px)}
.head .pct{display:block;font-size:clamp(92px,30vw,140px);color:var(--gold-l);text-shadow:0 5px 0 var(--red-d),0 10px 22px rgba(60,0,8,.45)}

.pile{position:relative;width:100%;aspect-ratio:10/7;max-width:100%;margin-top:-6px}
.pile img{position:absolute;bottom:0;object-fit:contain;filter:drop-shadow(0 12px 12px rgba(60,0,8,.45))}
.pile .i1{height:96%;left:50%;transform:translateX(-50%);bottom:4%;z-index:3}
.pile .i2{height:66%;right:2%;bottom:16%;z-index:2;transform:rotate(5deg)}
.pile .i3{height:66%;left:2%;bottom:16%;z-index:2;transform:rotate(-5deg)}
.pile .i4{height:40%;right:18%;bottom:0;z-index:4}
.pile .i5{height:34%;left:20%;bottom:0;z-index:4}
.pile .i6{width:30%;left:-2%;bottom:0;z-index:5}
.pile .i7{width:26%;right:-1%;bottom:2%;z-index:5}
.tag{position:absolute;z-index:6;top:4%;right:4%;width:clamp(86px,24vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;gap:0;
  background:radial-gradient(circle at 35% 30%,#fff4c4,var(--gold) 60%,#d58f05);color:var(--red-d);box-shadow:0 6px 14px rgba(60,0,8,.45);transform:rotate(8deg);line-height:1.05}
.tag small{font-size:11px;font-weight:800}
.tag b{font-size:clamp(20px,6vw,24px);font-weight:900}
.tag s{font-size:11px;font-weight:700;opacity:.75}

.until{margin-top:12px;font-size:clamp(17px,5vw,20px);font-weight:800}
.until .date{display:block;white-space:nowrap;line-height:1.1}
.until b{font-family:var(--f-display);font-weight:400;font-size:1.5em;color:var(--gold-l);margin-inline:4px}
.until .yr{font-size:.8em;color:var(--sun);font-weight:700}

.count{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.count-top{margin-top:4px;margin-bottom:6px;position:relative;z-index:7}
.count-l{font-size:14px;font-weight:700;color:var(--sun)}
.tiles{display:flex;gap:7px;direction:rtl}
.tiles div{min-width:60px;padding:7px 4px 5px;border-radius:12px;background:linear-gradient(180deg,#fff 50%,#f4eadb 50%);color:var(--red-d);box-shadow:0 4px 0 rgba(70,0,10,.45);display:flex;flex-direction:column;align-items:center}
.tiles .num{font-size:28px;font-weight:900;line-height:1}
.tiles small{font-size:11px;color:var(--muted);font-weight:700}

.tap{margin-top:16px;display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 26px;font-size:19px;font-weight:900;color:var(--red-d);
  background:linear-gradient(180deg,#fff3c4,var(--gold));box-shadow:0 5px 0 #b07b06,0 10px 20px rgba(60,0,8,.35)}
.tap svg{width:20px;height:20px}
.p-foot{margin-top:16px;width:100%;border-top:1px dashed rgba(255,227,154,.55);padding-top:10px;font-size:12.5px;color:var(--sun);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.ended{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 8px 30px}
.ended strong{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,13vw,60px);line-height:1.1;color:#fff}
.ended span{font-size:clamp(18px,5vw,22px);font-weight:800;color:var(--gold-l)}

/* delivery card under poster */
.deliver{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.deliver .ic{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:#e9f8ee;color:var(--wa);display:grid;place-items:center}
.deliver .tx{flex:1;min-width:0;line-height:1.3}
.deliver .tx small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.deliver .tx .num{font-size:24px;font-weight:900;color:var(--ink);user-select:all}
.copy{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:800;color:var(--red-d)}

/* floating delivery pill (both views) */
.fab{position:fixed;z-index:35;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;
  background:linear-gradient(180deg,#22c55e,var(--wa));color:#fff;border-radius:999px;padding:12px 22px 12px 18px;font-weight:900;font-size:17px;
  box-shadow:0 5px 0 var(--wa-d),0 12px 26px rgba(0,0,0,.3)}
body:not(.in-shop) .fab{position:static;transform:none;display:flex;width:fit-content;margin:-96px auto 28px}
body:not(.in-shop) .fab-off{width:min(92vw,420px)}
.fab svg{width:24px;height:24px;flex:0 0 auto}
.fab .num{font-weight:800;font-size:15px;opacity:.95;border-inline-start:1px solid rgba(255,255,255,.5);padding-inline-start:10px}

/* ============ SHOP ============ */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,var(--red),var(--red-d));color:#fff;box-shadow:0 2px 14px rgba(140,7,24,.3)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.back{background:none;border:0;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--gold-l);padding:6px 0;min-width:72px}
.topbar .t{font-family:var(--f-display);font-size:21px;text-align:center;line-height:1.15}
.topbar .t small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--sun)}
.mini{min-width:72px;text-align:left;font-size:11px;line-height:1.2;color:var(--sun)}
.mini .num{display:block;font-size:14px;font-weight:800;color:#fff}
.tabs{display:flex;gap:8px;padding-block:4px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid rgba(255,245,214,.6);background:transparent;color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--red);border-color:#fff}

main{padding-block:6px 110px}
.hl{margin-top:16px;display:flex;gap:10px;align-items:center;background:var(--sun);border:1px solid var(--gold-l);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.hl b{color:var(--red);font-weight:900}
.aisle{margin-top:22px}
.aisle-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.aisle-head h2{font-family:var(--f-display);font-weight:400;font-size:27px;margin:0;color:var(--red);line-height:1.2}
.aisle[data-cat="clean"] .aisle-head h2{color:var(--navy)}
.aisle[data-cat="elec"] .aisle-head h2{color:var(--teal)}
.aisle-head span{font-size:14px;color:var(--muted);font-weight:700}
.aisle-head::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 4px 14px rgba(213,19,43,.06)}
.stage{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:120px 120px 12px 12px;background:radial-gradient(90% 70% at 50% 35%,#fff 0%,#fff3d4 65%,#ffe2a1 100%);border:1px solid var(--gold-l);display:grid;place-items:center;overflow:hidden}
.aisle[data-cat="clean"] .stage{background:radial-gradient(90% 70% at 50% 35%,#fff 0%,#eaf3ff 65%,#d3e5fb 100%);border-color:#cfe1f7}
.aisle[data-cat="elec"] .stage{background:radial-gradient(90% 70% at 50% 35%,#fff 0%,#e6f7f2 65%,#cbeee4 100%);border-color:#c5eadf}
.stage img{max-width:84%;max-height:84%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(60,30,10,.16))}
.off{position:absolute;bottom:8px;right:8px;background:var(--red);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 9px;box-shadow:0 2px 6px rgba(213,19,43,.35)}
.card h3{margin:2px 0 0;font-size:15.5px;line-height:1.35;font-weight:800;text-wrap:balance;min-height:2.7em}
.spec{font-size:13px;color:var(--muted);min-height:1.5em}
.prices{display:flex;align-items:baseline;gap:6px 8px;flex-wrap:wrap;margin-top:auto}
.now{font-size:25px;font-weight:900;color:var(--red);line-height:1}
.aisle[data-cat="clean"] .now{color:var(--navy)}
.aisle[data-cat="elec"] .now{color:var(--teal)}
.cur{font-size:12px;color:var(--muted);font-weight:700}
.was{font-size:14px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}
.saves{font-size:13px;font-weight:800;color:#178a43}

.order{margin-top:30px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.order h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--red-d)}
.order p{margin:0;color:var(--muted)}
.order .num{font-size:30px;font-weight:900;user-select:all}
footer{text-align:center;color:var(--muted);font-size:13px;padding-block:6px 20px}

.fab-off{background:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.3);font-size:14px;font-weight:800;white-space:normal;text-align:center;width:min(92vw,420px);justify-content:center;padding:11px 16px;line-height:1.4}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}

@media (prefers-reduced-motion:no-preference){
  .pile img{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .pile .i2,.pile .i3{animation-delay:.1s}.pile .i4,.pile .i5{animation-delay:.2s}.pile .i6,.pile .i7{animation-delay:.28s}
  @keyframes rise{from{opacity:.2;translate:0 22px}}
  .tag{animation:wob 2.6s ease-in-out infinite}
  @keyframes wob{50%{transform:rotate(-4deg) scale(1.05)}}
  .tap{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 5px 0 #b07b06,0 0 0 8px rgba(246,185,40,.25),0 10px 20px rgba(60,0,8,.35)}}
}
</style>

<div class="fab fab-off" id="fabOff" hidden role="status">انتهى استقبال طلبات التوصيل · العروض متاحة في المركز حتى ١١ ليلاً</div>
<div class="toast" id="toast" hidden role="status"></div>
</div>

<script>
(function(){
/* Offer ends at the end of Mon 30 Nov 2026, Oman time (+04:00). */
const END = new Date('2026-11-30T23:00:00+04:00');      /* store closes 11 PM */
const DELIV_END = new Date('2026-11-30T20:00:00+04:00'); /* delivery orders stop 8 PM on the last day */

const P = [
  {id:'suroor',  c:'food', n:'حليب مبخر سرور', s:'كرتون ٤٨ حبة × ١٧٠ غ', o:7.850, v:5.990},
  {id:'khamail', c:'food', n:'جبنة قابلة للدهن الخمائل', s:'٢ × ٥٠٠ غ', o:2.500, v:2.090},
  {id:'salim',   c:'food', n:'جبنة مثلثات سالم', s:'٨ قطع', o:1.100, v:0.900},
  {id:'molino',  c:'food', n:'شوكولاتة مولينو بالبندق', s:'للحشو والدهن والحلويات', o:2.250, v:2.100},
  {id:'diwani',  c:'food', n:'مركز الفاكهة الملكي الديواني', s:'٧١٠ مل · فواكه مشكلة', o:1.100, v:0.990},
  {id:'safwa',   c:'food', n:'مكرونة الصفوة بيني', s:'جاهزة خلال ٨ دقائق', o:0.990, v:0.890},
  {id:'anabi',   c:'food', n:'مكرونة العنابي فيرميلي', s:'شعيرية', o:1.050, v:0.990},
  {id:'softener',c:'clean',n:'منعم الملابس مارفل', s:'٢ × ٢ لتر', o:1.890, v:1.490},
  {id:'zaydis',  c:'clean',n:'مطهر ومعقم زاي', s:'حبتان · ليمون وصنوبر', o:3.130, v:2.600},
  {id:'moni',    c:'clean',n:'مناديل ورقية موني باك', s:'١٠٠ منديل · طبقتين', o:1.000, v:0.790},
  {id:'dettol',  c:'clean',n:'مطهر ومعقم', s:'٣ × ٥٠٠ مل', o:0.990, v:0.790},
  {id:'rabea',   c:'clean',n:'سائل غسيل الصحون الربيع', s:'٢ × ٥٠٠ مل', o:0.700, v:0.550},
  {id:'lucky',   c:'clean',n:'سائل غسيل الصحون لاكي دش', s:'٣ × ١ لتر', o:1.550, v:1.290},
  {id:'rabea1l', c:'clean',n:'سائل غسيل الصحون الربيع', s:'٢ × ١ لتر', o:1.000, v:0.890},
  {id:'shams',   c:'clean',n:'سائل غسيل الصحون الشمس', s:'٢ × ٩٠٠ مل + ٤٥٠ مل', o:1.450, v:1.290},
  {id:'marvel',  c:'clean',n:'فلاش إكس من مارفل', s:'حبتان · منظف ومطهر', o:1.000, v:0.890},
  {id:'winix',   c:'clean',n:'وينكس سائل مبيض الملابس', s:'٢ × ١ جالون', o:1.900, v:1.790},
  {id:'gqh9105', c:'elec', n:'مدفأة جيباس كوارتز GQH9105', s:'٣٠٠ و٦٠٠ واط · ضمان سنتين', o:6.900, v:4.990},
  {id:'gqh9106', c:'elec', n:'مدفأة جيباس كوارتز GQH9106', s:'٤٠٠ و٨٠٠ واط · ضمان سنتين', o:7.500, v:5.500},
  {id:'gfh28547',c:'elec', n:'مدفأة جيباس مروحة تدفئة GFH28547', s:'١٠٠٠ و٢٠٠٠ واط · ضمان سنتين', o:8.125, v:7.000},
];
const AISLES = [{c:'food',t:'المواد الغذائية'},{c:'clean',t:'المنظفات والمنزل'},{c:'elec',t:'المدافئ الكهربائية'}];
const f3 = x => (Math.round(x*1000)/1000).toFixed(3);
const ar = n => String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $ = id => document.getElementById(id);
const ended = () => Date.now() >= END.getTime();
$('nOffers').textContent = ar(P.length);

function card(p){
  const pct = Math.round((1-p.v/p.o)*100);
  return `<article class="card">
    <div class="stage"><img src="img/${p.id}.webp" alt="${p.n}" loading="lazy">${pct>0?`<span class="off">خصم ${ar(pct)}٪</span>`:''}</div>
    <h3>${p.n}</h3><div class="spec">${p.s}</div>
    <div class="prices"><span class="now num">${f3(p.v)}</span><span class="cur">ر.ع</span><span class="was num">${f3(p.o)}</span></div>
    <div class="saves">وفّر <span class="num">${f3(p.o-p.v)}</span> ر.ع</div></article>`;
}
let built=false;
function build(){
  if(built) return; built=true;
  $('aisles').innerHTML = AISLES.map(a=>{
    const items = P.filter(p=>p.c===a.c).sort((x,y)=>(1-y.v/y.o)-(1-x.v/x.o));
    return `<section class="aisle" data-cat="${a.c}"><div class="aisle-head"><h2>${a.t}</h2><span>${ar(items.length)} ${items.length<=10?'عروض':'عرضاً'}</span></div><div class="grid">${items.map(card).join('')}</div></section>`;
  }).join('');
}

function endNow(){
  $('shop').hidden=true; $('cover').hidden=false; document.body.classList.remove('in-shop');
  $('live').hidden=true; $('live').style.display='none'; $('ended').hidden=false;
  $('poster').disabled=true;
}
function delivery(){
  const off = Date.now() >= DELIV_END.getTime();
  $('fab').hidden = off; $('fabOff').hidden = !off || ended(); $('orderBox').hidden = off;
}
function tick(){
  delivery();
  if(ended()){ endNow(); return; }
  let d = END.getTime()-Date.now();
  const parts = [[864e5,'يوم'],[36e5,'ساعة'],[6e4,'دقيقة'],[1e3,'ثانية']].map(([u,l])=>{ const n=Math.floor(d/u); d-=n*u; return [n,l]; });
  $('tiles').innerHTML = parts.map(([n,l])=>`<div><span class="num">${String(n).padStart(2,'0')}</span><small>${l}</small></div>`).join('');
  const [dd,hh,mm,ss]=parts.map(p=>String(p[0]).padStart(2,'0'));
  const D=parts[0][0]; $('miniD').textContent = D>0 ? 'باقي '+ar(D)+' '+(D===1?'يوم':D===2?'يومان':D<=10?'أيام':'يوماً') : 'آخر يوم'; $('mini').textContent = `${hh}:${mm}:${ss}`;
}

function showCover(){ $('shop').hidden=true; $('cover').hidden=false; document.body.classList.remove('in-shop'); }
function showShop(){ if(ended()){ endNow(); return; } build(); $('cover').hidden=true; $('shop').hidden=false; document.body.classList.add('in-shop'); window.scrollTo({top:0}); }
function route(){ if(location.hash==='#offers' && !ended()) showShop(); else showCover(); }
$('poster').addEventListener('click',()=>{ if(ended()) return; location.hash='offers'; showShop(); });
$('toCover').addEventListener('click',()=>{ location.hash='cover'; showCover(); });
window.addEventListener('hashchange',route);
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  document.querySelectorAll('.aisle').forEach(a=>a.hidden = b.dataset.f!=='all' && a.dataset.cat!==b.dataset.f);
  window.scrollTo({top:0});
}));

let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.copy;
  const fallback=()=>{ const r=document.createRange(); const n=b.parentElement.querySelector('.num'); if(n){ r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('حدّد الرقم وانسخه'); };
  try{ navigator.clipboard.writeText(v).then(()=>toast('تم نسخ الرقم 91441292'),fallback); }catch(e){ fallback(); }
}));

/* gold sunburst behind the poster */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ang=0;
function rays(){
  const c=$('rays'), r=c.getBoundingClientRect(); if(!r.width) return;
  const dpr=Math.min(2,devicePixelRatio||1);
  if(c.width!==Math.round(r.width*dpr)){ c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,r.width,r.height);
  const cx=r.width/2, cy=r.height*0.42, R=Math.hypot(r.width,r.height);
  const N=24; g.fillStyle='rgba(255,227,154,0.11)';
  for(let i=0;i<N;i++){ const a=ang+i*2*Math.PI/N, w=Math.PI/N*0.55;
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+R*Math.cos(a-w),cy+R*Math.sin(a-w)); g.lineTo(cx+R*Math.cos(a+w),cy+R*Math.sin(a+w)); g.closePath(); g.fill(); }
  const gl=g.createRadialGradient(cx,cy,0,cx,cy,r.width*0.55); gl.addColorStop(0,'rgba(255,240,190,.45)'); gl.addColorStop(1,'rgba(255,240,190,0)');
  g.fillStyle=gl; g.fillRect(0,0,r.width,r.height);
}
function loop(){ if(!$('cover').hidden){ ang+=0.0016; rays(); } requestAnimationFrame(loop); }
addEventListener('resize',rays);

route(); tick(); setInterval(tick,1000);
if(reduce) rays(); else requestAnimationFrame(loop);
})();
</script>

</html>
